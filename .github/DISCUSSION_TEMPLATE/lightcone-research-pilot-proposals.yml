# Category slug verified: lightcone-research-pilot-proposals. Publish on the default branch to activate.
title: "[Lightcone pilot proposal] "
labels: ["proposal"]
body:
  - type: markdown
    attributes:
      value: |
        Propose a research project for the **Lightcone Research Pilot**: an activity to test and improve
        Lightcone Research's agentic tooling on LSST science questions and workflows.
        
        The Lightcone team provides focused engineering, compute, and model inference to support participating research projects,
        and in return, participating projects provide feedback and insights to help improve the tools.

        Bring an interesting scientific problem and a willingness to try the tools, evaluate the outputs, and give feedback.
        No prior knowledge of Lightcone's tooling or fully designed agent architecture is needed.

        Resources are limited, and the goal is a focused effort with fast turnaround, so the Lightcone team aims to extend dedicated 
        support to a limited number of projects. Everyone is still welcome to experiment, collaborate, and share what they learn, 
        whether or not they receive that support. Comments help refine ideas; upvotes do not allocate resources.
        
        Read about the [Lightcone Research Pilot](https://github.com/LSSTDESC/agentic-research/blob/main/docs/lightcone-pilot/README.md).
  - type: textarea
    id: scientific-question
    attributes:
      label: Scientific question or objective
      description: What scientific goal or bottleneck does this address, and why does it matter?
    validations:
      required: true
  - type: textarea
    id: role-for-agents
    attributes:
      label: Potential role for AI agents
      description: Where might agents help? It is completely fine to be unsure; no architecture is needed.
    validations:
      required: false
  - type: textarea
    id: relevant-links
    attributes:
      label: Relevant repositories, code, and analysis links
      description: Link to relevant repositories, analysis code, notebooks, documentation, or prior work. Share only links authorized for public sharing; describe restricted resources at a high level instead.
    validations:
      required: false
  - type: textarea
    id: data-requirements
    attributes:
      label: Data and access requirements
      description: What datasets, simulations, or observations would you use? If known, describe their approximate size, where they are hosted, any access permissions needed, and whether the data must stay at a particular facility. Include only details suitable for public discussion.
    validations:
      required: false
  - type: textarea
    id: computing-requirements
    attributes:
      label: Computing environment and requirements
      description: Does the work need to run at NERSC, CC-IN2P3, on a local machine, or elsewhere? Note any required accounts or allocations, CPU/GPU or memory needs, software or containers, and restrictions on network access or external model inference. High-level requirements are enough; it is fine if details are not yet known. Do not include credentials.
    validations:
      required: false
  - type: textarea
    id: pilot-outcome
    attributes:
      label: What would a useful Lightcone pilot project demonstrate?
      description: Suggest a meaningful scientific outcome or early milestone and how you would evaluate the tooling's usefulness and limitations.
    validations:
      required: true
  - type: textarea
    id: scientific-contact
    attributes:
      label: Scientific point of contact and involvement
      description: Give a public professional name or GitHub handle and how you will work with the Lightcone team to try the tools, validate outputs, and give scientific feedback. No fixed weekly-hour quota; no private contact details.
    validations:
      required: true
  - type: input
    id: working-group
    attributes:
      label: Relevant DESC working group / collaborators
      description: Mention related efforts or collaborators to help make connections and avoid duplication.
    validations:
      required: false
